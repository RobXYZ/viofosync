# nginx in front of viofosync, serving clip video itself.
#
# Everything is proxied to the app. When you play a clip, the app sends
# the browser to the file's /media/ URL, and nginx sends the file from its
# own read-only mount of the recordings folder. Every range request and
# seek after that goes straight to nginx. nginx asks the app whether the
# browser is logged in, and remembers a yes for 30 seconds, so the app
# hears about it once in a while rather than on every request, and
# logging out (or "log out other sessions") takes effect within that.
#
# Mount at /etc/nginx/conf.d/default.conf in the official nginx image. See
# "Serving video through nginx" in the README.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Downloads use the same URLs, with the name to save the file under in
# name=. The app percent-encodes it, which is the form filename*= takes,
# so it's passed through as it is; anything else in it is ignored, so a
# made-up link can't put odd things in the header. Browsers use
# filename*; filename= is for tools like curl and wget that don't. No
# name means inline playback, with no Content-Disposition.
map $arg_name $media_disposition {
    "~^[A-Za-z0-9%._~-]+$" "attachment; filename=\"$arg_name\"; filename*=UTF-8''$arg_name";
    default "";
}

# The app's answers to "is this browser logged in?", by cookie.
proxy_cache_path /var/cache/nginx/viofosync_auth levels=1 keys_zone=viofosync_auth:1m
                 max_size=10m inactive=10m;

server {
    listen 8080;

    # Look the app up through Docker's DNS on every request, not just at
    # startup, so recreating its container (a new image, say) doesn't leave
    # nginx pointing at the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Change "viofosync:8080" if the app's service name or port differs.
    set $viofosync http://viofosync:8080;

    location / {
        proxy_pass $viofosync;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Tells the app nginx is here to serve /media/. Replaces any value
        # the browser sent.
        proxy_set_header X-Viofosync-Media 1;
        # The live progress feed is a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        # Pass uploads (Import manually) straight through as they arrive.
        # By default nginx would first write each one whole to a temp file
        # in this container, multi-GB clips included, before the app saw
        # a byte of it.
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /media/ {
        auth_request /_viofosync_auth;

        # Must match the recordings mount on this container.
        alias /recordings/;
        add_header Content-Disposition $media_disposition;
        sendfile on;
        tcp_nopush on;
    }

    location = /_viofosync_auth {
        internal;
        proxy_pass $viofosync/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Range "";
        proxy_set_header Host $http_host;
        # Send the app exactly what the answer is cached under, as one
        # header (nginx joins repeated Cookie headers into this).
        proxy_set_header Cookie $http_cookie;

        # Remember the answer for 30 seconds. A no is remembered too, so a
        # logged-out tab that keeps retrying (Safari does, many times a
        # second) doesn't ask the app every time. Logging in still works
        # straight away: it comes with a new cookie, so a new question.
        #
        # Keyed on the whole Cookie header, not just the session cookie:
        # with the session cookie sent twice nginx would pick the first and
        # the app the last, and a logged-in browser could then file a yes
        # under a cookie the app never checked (even under no cookie).
        proxy_cache viofosync_auth;
        proxy_cache_key $http_cookie;
        proxy_cache_valid 204 401 30s;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Vary;

        # When an answer runs out, keep using it while nginx asks again in
        # the background, so playback never waits on the app.
        proxy_cache_background_update on;
        # And keep using it while the app can't answer (restarting, say),
        # rather than failing every video. Answers are kept for up to 10
        # minutes after they were last used (inactive= above).
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    }
}
